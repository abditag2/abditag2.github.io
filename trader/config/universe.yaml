evm_arbitrum:  # tokens with deep on-chain liquidity on Arbitrum; signals still come from the Coinbase pair
  - BTC-USD
  - ETH-USD
  - LINK-USD
  - UNI-USD
  - AAVE-USD

chains:
  arbitrum:
    chain_id: 42161
    rpc_url_env: RPC_URL
    quote:  { symbol: USDC, address: "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", decimals: 6 }
    tokens:  # Coinbase symbol -> on-chain token. Run scripts/verify_universe.py before trading: it reads symbol()/decimals() on-chain.
      BTC-USD:  { symbol: WBTC, address: "0x2f2a2543B76A4166549F7aaB2e75Bef0aefC5B0f", decimals: 8 }
      ETH-USD:  { symbol: ETH,  address: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE", decimals: 18, native: true }  # the API rejects WETH on Arbitrum; native ETH is quoted and delivered
      LINK-USD: { symbol: LINK, address: "0xf97f4df75117a78c1A5a0DBb814Af92458539FB4", decimals: 18 }
      UNI-USD:  { symbol: UNI,  address: "0xFa7F8980b0f1E64A2062791cc3b0871572f1F7f0", decimals: 18 }
      AAVE-USD: { symbol: AAVE, address: "0xba5DdD1f9d7F570dc94a51479a000E3BCE967196", decimals: 18 }
    route_processors:  # whitelist; the Sushi API returns the current one in tx.to. Add new ones deliberately.
      - "0xac4c6e212a361c968f1725b4d055b47e63f80b75"
    max_price_impact: 0.003
    max_slippage: 0.003
    max_ref_deviation: 0.006   # abort if the quote price differs from the Coinbase reference by more than this
    max_gas_gwei: 2.0
    min_native_balance: 0.002  # ETH kept for gas; warn below this
