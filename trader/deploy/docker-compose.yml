# From the trader/ directory:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  trader:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: ../.env
    volumes: [ "../state:/app/state" ]
    restart: unless-stopped
    command: >
      python scripts/run.py --mode ${TRADER_MODE:-paper} --strategy ${TRADER_STRATEGY:-p1}
      --universe ${TRADER_UNIVERSE:-research22} --run-id ${TRADER_RUN_ID:-p1_paper} ${TRADER_EXTRA_ARGS:-}
  dashboard:
    build: { context: .., dockerfile: deploy/Dockerfile }
    volumes: [ "../state:/app/state" ]
    ports: [ "127.0.0.1:8501:8501" ]      # localhost only; reach it over an SSH tunnel or Tailscale
    restart: unless-stopped
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
